<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Desenho original (estilo chapado), fatia de bolo em corte, ponta para baixo. -->
  <defs>
    <radialGradient id="luz" cx="0.3" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#FF7AA6"/>
      <stop offset="1" stop-color="#E23E78"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#luz)"/>
  <g>
    <ellipse cx="256" cy="462" rx="150" ry="13" fill="#7A1840" opacity="0.22"/>
    <!-- camada inferior de massa (até a ponta) -->
    <path d="M197 320 L315 320 L256 450 Z" fill="#FFDDA6"/>
    <!-- recheio -->
    <path d="M188 300 L324 300 L315 320 L197 320 Z" fill="#F49AC8"/>
    <!-- camada superior de massa -->
    <path d="M157 230 L355 230 L324 300 L188 300 Z" fill="#FFC97A"/>
    <!-- escorridos da cobertura sobre a massa -->
    <path d="M196 224 V282 C196 296 216 296 216 282 V224 Z" fill="#FFB6D9"/>
    <path d="M306 224 V294 C306 308 326 308 326 294 V224 Z" fill="#FFB6D9"/>
    <path d="M317 228 V298 C321 296 326 294 326 286 V228 Z" fill="#F49AC8"/>
    <!-- cobertura (topo da fatia) -->
    <path d="M130 170 L382 170 L355 230 L157 230 Z" fill="#FFB6D9"/>
    <path d="M130 170 L382 170 L368 200 L146 200 Z" fill="#FFCFE4"/>
    <!-- confeitos sobre a cobertura e a massa -->
    <g stroke-width="9" stroke-linecap="round">
      <path d="M168 192 l14 4" stroke="#2EC4A0"/>
      <path d="M352 196 l-8 13" stroke="#F9B800"/>
      <path d="M232 258 l15 2" stroke="#3AA0E0"/>
      <path d="M272 266 l-10 11" stroke="#FFFFFF"/>
      <path d="M220 340 l14 2" stroke="#8E5BE8"/>
      <path d="M284 346 l-9 12" stroke="#F9B800"/>
    </g>
    <!-- cereja no topo da fatia -->
    <path d="M258 88 C254 68 262 52 278 42" stroke="#C98B78" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="266" cy="112" r="30" fill="#F2545B" stroke="#FFE6F1" stroke-width="6"/>
    <ellipse cx="255" cy="101" rx="9" ry="6" fill="#FFFFFF" opacity="0.65"/>
  </g>
</svg>
